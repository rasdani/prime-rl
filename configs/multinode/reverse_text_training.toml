# Configuration for TRAINING node (10.15.35.65)
# Usage: uv run rl_multinode @ configs/multinode/reverse_text_training.toml

# Use all 8 H100s for training
trainer_gpus = 8

# Multi-node configuration
[multinode]
mode = "training"
master_addr = "localhost"  # Single-node training - no coordination needed
inference_addr = "10.15.35.113"
inference_port = 8000
nnodes = 1  # Single-node mode
node_rank = 0

# Trainer configuration
[trainer]
max_steps = 30

[trainer.model]
name = "willcb/Qwen2.5-0.5B-Reverse-SFT"

[trainer.optim] 
lr = 3e-6

[trainer.ckpt]
interval = 10
path = "/mnt/shared-weights/checkpoints"

[trainer.data]
path = "/mnt/shared-weights/data"

[trainer.weights]
path = "/mnt/shared-weights/weights"

# Orchestrator configuration (points to inference node)
[orchestrator]
max_steps = 30
batch_size = 128
micro_batch_size = 8
rollouts_per_prompt = 8
seq_len = 512

[orchestrator.model]
name = "willcb/Qwen2.5-0.5B-Reverse-SFT"

[orchestrator.client]
host = "10.15.35.113"
port = 8000

[orchestrator.environment]
id = "reverse-text"

[orchestrator.ckpt]
interval = 10