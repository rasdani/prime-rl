# Configuration for TRAINING node (10.15.35.65)
# Usage: uv run rl_multinode @ configs/multinode/swe_rl_training.toml

# Use all 8 H100s for training
trainer_gpus = 8

# Multi-node configuration
[multinode]
mode = "training"
master_addr = "localhost"  # Single-node training - no coordination needed
inference_addr = "10.15.35.113"
inference_port = 8000
nnodes = 1  # Single-node mode
node_rank = 0


[trainer.model]
name = "Qwen/Qwen3-1.7B"
ac = true

[trainer.optim]
lr = 1e-6

[trainer.ckpt]
interval = 1
path = "/mnt/shared-weights/checkpoints"

[trainer.data]
path = "/mnt/shared-weights/data"

[trainer.weights]
path = "/mnt/shared-weights/weights"

[trainer.monitor.wandb]
project = "prime-rl-swe-rl"

# Orchestrator configuration (points to inference node)
[orchestrator]
batch_size = 32
micro_batch_size = 8
rollouts_per_prompt = 8
seq_len = 16384
mask_truncated_completions = true

[orchestrator.model]
name = "Qwen/Qwen3-1.7B"

[orchestrator.client]
host = "10.15.35.113"
port = 8000

[orchestrator.environment]
id = "swe-rl"

[orchestrator.sampling]
max_tokens = 8192
temperature = 0.6

[orchestrator.ckpt]
interval = 1