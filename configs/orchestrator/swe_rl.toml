max_steps = 10
batch_size = 2
micro_batch_size = 1
rollouts_per_prompt = 2
seq_len = 16384
mask_truncated_completions = true

[model]
name = "Qwen/Qwen3-0.6B"

[environment]
id = "swe-rl"

[sampling]
max_tokens = 8192
temperature = 0.6

[monitor.wandb]

[monitor.wandb.log_samples]
interval = 5
num_samples = 2
